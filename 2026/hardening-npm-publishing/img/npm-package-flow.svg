      <path d="M 0 0 L 12 6 L 0 12 z" fill="#334155"/>
    </marker>
  </defs>

  <rect width="1600" height="560" fill="#ffffff"/>

  <g font-family="Arial">
    <text x="800" y="58" text-anchor="middle" font-size="36" font-weight="700" fill="#0f172a">
      Developer local → GitHub → npm → User local
    </text>

    <line x1="368" y1="276" x2="440" y2="276" stroke="#334155" stroke-width="5" marker-end="url(#arrow)"/>
    <line x1="758" y1="276" x2="816" y2="276" stroke="#334155" stroke-width="5" marker-end="url(#arrow)"/>
    <line x1="1148" y1="276" x2="1220" y2="276" stroke="#334155" stroke-width="5" marker-end="url(#arrow)"/>

    <g transform="translate(58 136)">
      <rect width="310" height="250" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="5"/>
