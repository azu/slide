      <text x="155" y="164" text-anchor="middle" font-size="20" font-weight="600" fill="#475569">review / workflow</text>
    </g>

    <g transform="translate(838 136)">
      <rect width="310" height="250" rx="10" fill="#fff7ed" stroke="#f97316" stroke-width="5"/>
