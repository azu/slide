<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="500" viewBox="0 0 1280 500">
  <rect width="1280" height="500" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#374151"/>
    </marker>
    <style>
      .rowLabel { font: 700 22px "Hiragino Sans", "Noto Sans CJK JP", sans-serif; fill: #4b5563; text-anchor: end; dominant-baseline: central; }
      .nodeTitle { font: 700 29px "Hiragino Sans", "Noto Sans CJK JP", sans-serif; fill: #111827; text-anchor: middle; dominant-baseline: central; }
      .nodeSub { font: 20px "Hiragino Sans", "Noto Sans CJK JP", sans-serif; fill: #4b5563; text-anchor: middle; dominant-baseline: central; }
      .gateTitle { font: 700 24px "Hiragino Sans", "Noto Sans CJK JP", sans-serif; fill: #7c2d12; text-anchor: middle; dominant-baseline: central; }
      .gateSub { font: 17px "Hiragino Sans", "Noto Sans CJK JP", sans-serif; fill: #7c2d12; text-anchor: middle; dominant-baseline: central; }
      .controlTitle { font: 700 22px "Hiragino Sans", "Noto Sans CJK JP", sans-serif; fill: #166534; text-anchor: middle; dominant-baseline: middle; }
      .controlSub { font: 16px "Hiragino Sans", "Noto Sans CJK JP", sans-serif; fill: #166534; text-anchor: middle; dominant-baseline: middle; }
      .flowArrow { stroke: #374151; stroke-width: 5; stroke-linecap: round; marker-end: url(#arrow); }
      .gateLine { stroke: #fb923c; stroke-width: 3; stroke-linecap: round; }
    </style>
  </defs>

  <text class="rowLabel" x="110" y="100">公開経路</text>
  <text class="rowLabel" x="110" y="256">確認点</text>
