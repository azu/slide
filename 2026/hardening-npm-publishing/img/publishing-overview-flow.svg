  <line class="gateLine" x1="970" y1="154" x2="970" y2="204"/>

  <rect x="300" y="204" width="180" height="86" rx="14" fill="#fff7ed" stroke="#fb923c" stroke-width="3"/>
  <rect x="625" y="204" width="250" height="86" rx="14" fill="#fff7ed" stroke="#fb923c" stroke-width="3"/>
  <rect x="895" y="204" width="220" height="86" rx="14" fill="#fff7ed" stroke="#fb923c" stroke-width="3"/>

  <text class="gateTitle" x="390" y="231">PR Review</text>
  <text class="gateSub" x="390" y="260">mainへ入る前</text>
