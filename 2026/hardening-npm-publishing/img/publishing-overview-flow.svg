  <rect x="150" y="368" width="190" height="76" rx="13" fill="#f0fdf4" stroke="#22c55e" stroke-width="3"/>
  <rect x="385" y="368" width="190" height="76" rx="13" fill="#f0fdf4" stroke="#22c55e" stroke-width="3"/>
  <rect x="620" y="368" width="200" height="76" rx="13" fill="#f0fdf4" stroke="#22c55e" stroke-width="3"/>
  <rect x="860" y="368" width="190" height="76" rx="13" fill="#f0fdf4" stroke="#22c55e" stroke-width="3"/>

  <text class="controlTitle" x="245" y="394">token 0</text>
  <text class="controlSub" x="245" y="421">長期tokenを置かない</text>
  <text class="controlTitle" x="480" y="394">OIDC</text>
  <text class="controlSub" x="480" y="421">短期credential</text>
