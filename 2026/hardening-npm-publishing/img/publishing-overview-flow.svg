  <rect x="150" y="46" width="138" height="108" rx="15" fill="#f8fafc" stroke="#9ca3af" stroke-width="3"/>
  <rect x="330" y="46" width="120" height="108" rx="15" fill="#eff6ff" stroke="#2b6cb0" stroke-width="3"/>
  <rect x="500" y="46" width="140" height="108" rx="15" fill="#f0fdf4" stroke="#16a34a" stroke-width="3"/>
  <rect x="700" y="46" width="130" height="108" rx="15" fill="#fff7ed" stroke="#c05621" stroke-width="3"/>
  <rect x="895" y="46" width="150" height="108" rx="15" fill="#faf5ff" stroke="#9333ea" stroke-width="3"/>
  <rect x="1112" y="46" width="132" height="108" rx="15" fill="#f8fafc" stroke="#6b7280" stroke-width="3"/>

